services:
  backend:
    build:
      context: ./backend
    container_name: starrc-backend
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: local
      DATABASE_PATH: /data/app.db
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - ./backend/data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: starrc-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
