services:
  postgres:
    image: postgres:16-alpine
    container_name: starrc-postgres
    restart: always
    environment:
      POSTGRES_DB: starrc_audit
      POSTGRES_USER: starrc
      POSTGRES_PASSWORD: starrc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starrc -d starrc_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: starrc-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: local
      DATABASE_PATH: /data/app.db
      AUDIT_DATABASE_URL: postgresql://starrc:starrc@postgres:5432/starrc_audit
      FILEMAKER_READ_ONLY: "true"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - ./backend/data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: starrc-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
