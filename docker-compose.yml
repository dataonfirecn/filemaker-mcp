services:
  postgres:
    image: postgres:16-alpine
    container_name: starrc-postgres
    restart: always
    environment:
      POSTGRES_DB: starrc_audit
      POSTGRES_USER: starrc
      POSTGRES_PASSWORD: starrc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starrc -d starrc_audit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: starrc-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: local
      DATABASE_PATH: /data/app.db
      AUDIT_DATABASE_URL: postgresql://starrc:starrc@postgres:5432/starrc_audit
      FILEMAKER_READ_ONLY: "true"
      FILEMAKER_WEB_MERGE_ENABLED: ${FILEMAKER_WEB_MERGE_ENABLED:-false}
      FILEMAKER_WEB_MERGE_ORDER_CREATE_LAYOUT: ${FILEMAKER_WEB_MERGE_ORDER_CREATE_LAYOUT:-訂單 資料_業務_EDIT}
      FILEMAKER_WEB_MERGE_ORDER_DATE_FIELD: ${FILEMAKER_WEB_MERGE_ORDER_DATE_FIELD-日期}
      FILEMAKER_ODATA_ENABLED: ${FILEMAKER_ODATA_ENABLED:-true}
      FILEMAKER_ODATA_VERSION: ${FILEMAKER_ODATA_VERSION:-v4}
      FILEMAKER_ODATA_AUTH_MODE: ${FILEMAKER_ODATA_AUTH_MODE:-basic}
      FILEMAKER_ODATA_FMID_TOKEN: ${FILEMAKER_ODATA_FMID_TOKEN:-}
      FILEMAKER_ODATA_MAX_TOP: ${FILEMAKER_ODATA_MAX_TOP:-10}
      SEMANTIC_MAPPING_PATH: ${SEMANTIC_MAPPING_PATH:-config/semantic_mapping.json}
      WEBVIEWER_PRIVILEGE_SET_POLICY_PATH: ${WEBVIEWER_PRIVILEGE_SET_POLICY_PATH:-config/webviewer_privilege_sets.json}
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://127.0.0.1:5173
      NATURAL_QUERY_LLM_ENABLED: ${NATURAL_QUERY_LLM_ENABLED:-false}
      NATURAL_QUERY_USE_CACHED_RECORDS: ${NATURAL_QUERY_USE_CACHED_RECORDS:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-320}
      RAG_DATABASE_PATH: /data/rag_index.db
      RAG_INDEX_REFRESH_ON_STARTUP: ${RAG_INDEX_REFRESH_ON_STARTUP:-false}
      RAG_INDEX_REFRESH_SCHEDULE_TIME: "00:00"
      RAG_INDEX_REFRESH_SCHEDULE_TIMEZONE: Asia/Shanghai
      RAG_INDEX_LAYOUT_PREFIX: ${RAG_INDEX_LAYOUT_PREFIX:-@}
      RAG_INDEX_LAYOUT_INCLUDE: ${RAG_INDEX_LAYOUT_INCLUDE:-@products,@零件}
      RAG_INDEX_LAYOUT_EXCLUDE: ${RAG_INDEX_LAYOUT_EXCLUDE:-}
      RAG_INDEX_PAGE_SIZE: ${RAG_INDEX_PAGE_SIZE:-500}
      RAG_INDEX_MAX_RECORDS_PER_LAYOUT: ${RAG_INDEX_MAX_RECORDS_PER_LAYOUT:-5000}
      RAG_INDEX_MAX_FIELDS_PER_RECORD: ${RAG_INDEX_MAX_FIELDS_PER_RECORD:-40}
      RAG_INDEX_SEMANTIC_PROFILE_LAYOUTS: ${RAG_INDEX_SEMANTIC_PROFILE_LAYOUTS:-@products,@零件}
    volumes:
      - ./backend/data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: starrc-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
