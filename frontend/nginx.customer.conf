server {
  listen 80;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cache-Control "no-store" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The customer container exposes only auth, scoped queries/catalogs, and scoped images.
  location ~ ^/api/customer-chat/(login|me|query|change-password|admin/(history|question-summary|accounts(/[A-Za-z0-9._-]+)?)|(products|parts)/[0-9]+/image|products/[0-9]+/images/[0-9]+|catalog/(products|parts)/export\.xlsx|catalog/orders/summary|catalog/(orders|products|parts)(/[0-9]+)?)$ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Fail closed for every internal API, including direct URL attempts.
  location /api/ {
    return 404;
  }

  location = / {
    return 302 /customer-chat;
  }

  location = /customer.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files /customer.html =404;
  }

  location = /customer-chat/ {
    return 308 /customer-chat;
  }

  location = /customer-chat {
    try_files /customer.html =404;
  }

  location ~ ^/customer-chat/(orders|products|parts)(/[0-9]+)?$ {
    try_files /customer.html =404;
  }

  location = /customer-chat/account/password {
    try_files /customer.html =404;
  }

  location ~ ^/customer-chat/settings(/(appearance|password))?$ {
    try_files /customer.html =404;
  }

  location = /customer-chat/admin/analytics {
    try_files /customer.html =404;
  }

  location = /customer-chat/admin/accounts {
    try_files /customer.html =404;
  }

  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Do not serve the internal React application on any other route.
  location / {
    return 404;
  }
}
