services:
  postgres:
    image: postgres:16-alpine
    container_name: starrc-mayako-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: starrc_mayako
      POSTGRES_USER: starrc_mayako
      POSTGRES_PASSWORD: ${MAYAKO_POSTGRES_PASSWORD}
    volumes:
      - mayako_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starrc_mayako -d starrc_mayako"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${MAYAKO_BACKEND_IMAGE}
    container_name: starrc-mayako-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DATABASE_PATH: /data/app.db
      AUDIT_DATABASE_URL: postgresql://starrc_mayako:${MAYAKO_POSTGRES_PASSWORD}@postgres:5432/starrc_mayako
      FILEMAKER_READ_ONLY: "true"
      NATURAL_QUERY_LLM_ENABLED: "false"
      NATURAL_QUERY_ANALYTICS_LLM_ENABLED: "false"
      NATURAL_QUERY_USE_RAG: "false"
      RAG_INDEX_ENABLED: "false"
      RAG_INDEX_REFRESH_ON_STARTUP: "false"
      RAG_DATABASE_PATH: /data/rag_index.db
      WEBVIEWER_ALLOW_MOCK_CONTEXT: "false"
      CUSTOMER_CHAT_ENABLED: "true"
      CORS_ORIGINS: https://mayakofm.dataonfire.cn
      QR_BASE_URL: https://mayakofm.dataonfire.cn/q
    volumes:
      - mayako_backend_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ${MAYAKO_FRONTEND_IMAGE}
    container_name: starrc-mayako-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18002:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mayako_postgres_data:
  mayako_backend_data:
