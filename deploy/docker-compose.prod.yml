services:
  backend:
    build:
      context: ./backend
    container_name: starrc-backend
    restart: always
    env_file:
      - .env
    environment:
      APP_ENV: prod
      DATABASE_PATH: /data/app.db
      AUDIT_DATABASE_URL: memory://audit
      FILEMAKER_READ_ONLY: "true"
      CORS_ORIGINS: https://starrc.dataonfire.cn,http://localhost:8080
      QR_BASE_URL: https://starrc.dataonfire.cn/q
      FILEMAKER_HOST: ${FILEMAKER_HOST}
      FILEMAKER_DATABASE: ${FILEMAKER_DATABASE}
      FILEMAKER_USERNAME: ${FILEMAKER_USERNAME}
      FILEMAKER_PASSWORD: ${FILEMAKER_PASSWORD}
      FILEMAKER_API_VERSION: ${FILEMAKER_API_VERSION:-v2}
      FILEMAKER_SSL_VERIFY: ${FILEMAKER_SSL_VERIFY:-false}
      FILEMAKER_TOKEN_INACTIVITY_TIMEOUT_SECONDS: ${FILEMAKER_TOKEN_INACTIVITY_TIMEOUT_SECONDS:-900}
      FILEMAKER_ODATA_ENABLED: ${FILEMAKER_ODATA_ENABLED:-true}
      FILEMAKER_ODATA_VERSION: ${FILEMAKER_ODATA_VERSION:-v4}
      FILEMAKER_ODATA_AUTH_MODE: ${FILEMAKER_ODATA_AUTH_MODE:-basic}
      FILEMAKER_ODATA_FMID_TOKEN: ${FILEMAKER_ODATA_FMID_TOKEN:-}
      FILEMAKER_ODATA_MAX_TOP: ${FILEMAKER_ODATA_MAX_TOP:-10}
      SEMANTIC_MAPPING_PATH: ${SEMANTIC_MAPPING_PATH:-config/semantic_mapping.json}
      NATURAL_QUERY_LLM_ENABLED: ${NATURAL_QUERY_LLM_ENABLED:-false}
      NATURAL_QUERY_USE_CACHED_RECORDS: ${NATURAL_QUERY_USE_CACHED_RECORDS:-false}
      NATURAL_QUERY_MAX_DISPLAY_ROWS: ${NATURAL_QUERY_MAX_DISPLAY_ROWS:-10}
      NATURAL_QUERY_ANALYTICS_LLM_ENABLED: ${NATURAL_QUERY_ANALYTICS_LLM_ENABLED:-true}
      NATURAL_QUERY_ANALYTICS_PENDING_LIMIT: ${NATURAL_QUERY_ANALYTICS_PENDING_LIMIT:-100}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-12}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-320}
      WEBVIEWER_CONTEXT_SECRET: ${WEBVIEWER_CONTEXT_SECRET}
      WEBVIEWER_ALLOW_MOCK_CONTEXT: ${WEBVIEWER_ALLOW_MOCK_CONTEXT:-true}
      WEBVIEWER_SESSION_TTL_SECONDS: ${WEBVIEWER_SESSION_TTL_SECONDS:-28800}
      CUSTOMER_CHAT_ENABLED: ${CUSTOMER_CHAT_ENABLED:-false}
      CUSTOMER_CHAT_TOKEN_SECRET: ${CUSTOMER_CHAT_TOKEN_SECRET:-}
      CUSTOMER_CHAT_SESSION_TTL_SECONDS: ${CUSTOMER_CHAT_SESSION_TTL_SECONDS:-7200}
      CUSTOMER_CHAT_LOGIN_MAX_ATTEMPTS: ${CUSTOMER_CHAT_LOGIN_MAX_ATTEMPTS:-5}
      CUSTOMER_CHAT_LOGIN_WINDOW_SECONDS: ${CUSTOMER_CHAT_LOGIN_WINDOW_SECONDS:-900}
      CUSTOMER_CHAT_ACCOUNTS_JSON: ${CUSTOMER_CHAT_ACCOUNTS_JSON:-[]}
      MES_CALLBACK_API_KEY: ${MES_CALLBACK_API_KEY:-}
      MES_HMAC_SECRET: ${MES_HMAC_SECRET:-}
      MES_FILEMAKER_LAYOUT: ${MES_FILEMAKER_LAYOUT:-}
      MES_FILEMAKER_SCRIPT_NAME: ${MES_FILEMAKER_SCRIPT_NAME:-MES_UpdateWorkOrder}
      CALLBACK_MAX_ATTEMPTS: ${CALLBACK_MAX_ATTEMPTS:-8}
      RAG_INDEX_ENABLED: ${RAG_INDEX_ENABLED:-true}
      RAG_DATABASE_PATH: /data/rag_index.db
      RAG_INDEX_REFRESH_ON_STARTUP: ${RAG_INDEX_REFRESH_ON_STARTUP:-false}
      RAG_INDEX_STARTUP_DELAY_SECONDS: ${RAG_INDEX_STARTUP_DELAY_SECONDS:-20}
      RAG_INDEX_REFRESH_INTERVAL_SECONDS: ${RAG_INDEX_REFRESH_INTERVAL_SECONDS:-21600}
      RAG_INDEX_REFRESH_SCHEDULE_TIME: ${RAG_INDEX_REFRESH_SCHEDULE_TIME:-00:00}
      RAG_INDEX_REFRESH_SCHEDULE_TIMEZONE: ${RAG_INDEX_REFRESH_SCHEDULE_TIMEZONE:-Asia/Shanghai}
      RAG_INDEX_LAYOUT_PREFIX: ${RAG_INDEX_LAYOUT_PREFIX:-@}
      RAG_INDEX_LAYOUT_INCLUDE: ${RAG_INDEX_LAYOUT_INCLUDE:-@products,@零件}
      RAG_INDEX_LAYOUT_EXCLUDE: ${RAG_INDEX_LAYOUT_EXCLUDE:-}
      RAG_INDEX_MAX_LAYOUTS: ${RAG_INDEX_MAX_LAYOUTS:-0}
      RAG_INDEX_READ_LAYOUT_FIELDS: ${RAG_INDEX_READ_LAYOUT_FIELDS:-true}
      RAG_INDEX_LAYOUT_FIELDS_TIMEOUT_SECONDS: ${RAG_INDEX_LAYOUT_FIELDS_TIMEOUT_SECONDS:-8}
      RAG_INDEX_PAGE_SIZE: ${RAG_INDEX_PAGE_SIZE:-500}
      RAG_INDEX_MAX_RECORDS_PER_LAYOUT: ${RAG_INDEX_MAX_RECORDS_PER_LAYOUT:-5000}
      RAG_INDEX_MAX_FIELDS_PER_RECORD: ${RAG_INDEX_MAX_FIELDS_PER_RECORD:-40}
      RAG_INDEX_VALUE_MAX_LENGTH: ${RAG_INDEX_VALUE_MAX_LENGTH:-160}
      RAG_INDEX_SEMANTIC_PROFILE_ENABLED: ${RAG_INDEX_SEMANTIC_PROFILE_ENABLED:-true}
      RAG_INDEX_SEMANTIC_PROFILE_LAYOUTS: ${RAG_INDEX_SEMANTIC_PROFILE_LAYOUTS:-@products,@零件}
      RAG_INDEX_SEMANTIC_SAMPLE_RECORDS: ${RAG_INDEX_SEMANTIC_SAMPLE_RECORDS:-200}
      RAG_INDEX_SEMANTIC_LLM_TIMEOUT_SECONDS: ${RAG_INDEX_SEMANTIC_LLM_TIMEOUT_SECONDS:-30}
      RAG_INDEX_SEMANTIC_LLM_MAX_OUTPUT_TOKENS: ${RAG_INDEX_SEMANTIC_LLM_MAX_OUTPUT_TOKENS:-3600}
    volumes:
      - starrc_backend_data:/data
    ports:
      - "127.0.0.1:18001:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: starrc-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:80"

volumes:
  starrc_backend_data:
